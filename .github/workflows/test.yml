name: test

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      coverage-branch:
        description: 'Branch whose Coveralls baseline should be rebuilt'
        required: true
        default: develop
        type: string

env:
  E2E_DATAVERSE_IMAGE_TAG: unstable

jobs:
  e2e:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - name: Create .npmrc
        run: |
          cp .npmrc.example .npmrc
          sed -i -e 's/<YOUR_GITHUB_AUTH_TOKEN>/${{ secrets.GITHUB_TOKEN }}/g' .npmrc
          sed -i -e 's/<YOUR_NPM_AUTH_TOKEN>/${{ secrets.NPM_AUTH_TOKEN }}/g' .npmrc

      - name: Install Dependencies
        run: npm install

      - name: Build Dataverse Design System
        working-directory: packages/design-system
        run: npm run build

      - name: Create containerized development environment .env file
        working-directory: dev-env
        run: cp .env.example .env
        shell: bash

      - name: Update registry for the containerized development environment
        working-directory: dev-env
        run: |
          sed -i~ '/^REGISTRY=/s/=.*/=docker.io/' .env
        shell: bash

      - name: Map LocalStack endpoint to localhost
        run: echo "127.0.0.1 s3.localhost" | sudo tee -a /etc/hosts

      - name: Start containers
        working-directory: dev-env
        run: ./run-env.sh "$E2E_DATAVERSE_IMAGE_TAG"

      - name: Wait for containers to be ready
        run: timeout 600s sh -c 'while ! docker logs dev_dataverse_bootstrap 2>&1 | grep -q "your instance has been configured"; do sleep 2; done'

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v2
        with:
          dest: './logs'

      - name: Tar logs
        if: failure()
        run: tar cvzf ./logs.tgz ./logs

      - name: Upload logs to GitHub
        if: failure()
        uses: actions/upload-artifact@master
        with:
          name: logs.tgz
          path: ./logs.tgz

  component:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ inputs.coverage-branch || '' }}

      - name: Identify baseline source commit
        if: github.event_name == 'workflow_dispatch'
        id: coverage-source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - name: Create .npmrc
        run: |
          cp .npmrc.example .npmrc
          sed -i -e 's/<YOUR_GITHUB_AUTH_TOKEN>/${{ secrets.GITHUB_TOKEN }}/g' .npmrc
          sed -i -e 's/<YOUR_NPM_AUTH_TOKEN>/${{ secrets.NPM_AUTH_TOKEN }}/g' .npmrc

      - name: Install Dependencies
        run: npm install

      - name: Build Dataverse Design System
        working-directory: packages/design-system
        run: npm run build

      - name: Cypress run
        uses: cypress-io/github-action@v5
        with:
          component: true
      - name: Cypress run Design System
        uses: cypress-io/github-action@v5
        with:
          project: packages/design-system
          component: true

      - name: Check coverage
        run: npm run test:coverage-all

      - name: Merge coverage
        # Keep the corrected merge logic when rebuilding an older branch's baseline.
        run: |
          test -s coverage/lcov.info
          test -s packages/design-system/coverage/lcov.info
          mkdir -p merged-coverage
          ./node_modules/.bin/lcov-result-merger '{coverage,packages/design-system/coverage}/lcov.info' 'merged-coverage/lcov.info' --prepend-source-files

      - name: Upload coverage report to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          path-to-lcov: './merged-coverage/lcov.info'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          git-branch: ${{ inputs.coverage-branch || '' }}
          git-commit: ${{ steps.coverage-source.outputs.commit || '' }}

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: ./cypress/screenshots
